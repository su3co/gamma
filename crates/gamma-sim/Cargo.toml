[package]
name = "gamma-sim"
description = "gamma: lightsim integration (set-up slices, estimates, live runs, results)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# NVIDIA GPUs through lightsim-cuda (Linux with CUDA 13).
cuda = ["dep:lightsim-cuda", "dep:cuda-core"]

[dependencies]
gamma-core.workspace = true
lightsim-core.workspace = true
lightsim-cuda = { workspace = true, optional = true }
cuda-core = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
base64.workspace = true
rayon.workspace = true
num-complex.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true

[project]
name = "gamma-pic"
version = "0.1.0"
description = "Helpers for gamma project scripts: write layouts (GDS + ports) and lightsim simulation specs where gamma expects them"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gdsfactory = ["gdsfactory>=9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gamma_pic"]
